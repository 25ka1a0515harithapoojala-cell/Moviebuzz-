<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBuzz - Movies</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🎬 MovieBuzz</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="people.html">People</a>
            <a href="photos.html">Photos</a>
        </nav>
    </header>

    <main class="page-container">

        <section class="page-heading">
            <h1>All <span>Movies</span></h1>
            <p>Explore movies, stars and stories.</p>
        </section>

        <section class="movie-filters">

            <input
                type="text"
                id="moviesSearch"
                placeholder="Search movies..."
            >

            <select id="languageFilter">
                <option value="all">All Languages</option>
                <option value="Telugu">Telugu</option>
                <option value="Tamil">Tamil</option>
                <option value="Hindi">Hindi</option>
                <option value="Malayalam">Malayalam</option>
                <option value="Kannada">Kannada</option>
            </select>

            <select id="genreFilter">
                <option value="all">All Genres</option>
                <option value="Action">Action</option>
                <option value="Drama">Drama</option>
                <option value="Romance">Romance</option>
                <option value="Comedy">Comedy</option>
            </select>

        </section>

        <section id="moviesGrid" class="movies-grid"></section>

        <p id="moviesMessage" class="search-message"></p>

    </main>

    <footer>
        <p>© 2026 MovieBuzz. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
